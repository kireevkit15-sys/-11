# Diva — production stack for the VPS (Selectel / TimeWeb).
# Usage: `make prod-up` (or `docker compose -f docker-compose.prod.yml --env-file .env up -d`).
# Caddy is the only ingress (80/443) — terminates TLS via Let's Encrypt and reverse-proxies
# to web (Next.js) and cms (Strapi). Postgres, cms, web, bot are NOT exposed externally.
# All services live on the internal `diva` bridge network.

version: '3.9'

networks:
  diva:
    driver: bridge

volumes:
  postgres-data:
  strapi-uploads:
  caddy-data:
  caddy-config:

services:
  postgres:
    build:
      context: ../db
    container_name: diva-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No external port published — only reachable inside `diva` network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - diva

  cms:
    build:
      context: ../cms
    container_name: diva-cms
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # No external port — Caddy reverse-proxies admin.${DOMAIN} -> cms:1337.
    volumes:
      - strapi-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1337/_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - diva

  web:
    build:
      context: ../web
    container_name: diva-web
    depends_on:
      cms:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_STRAPI_URL: https://${ADMIN_DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # No external port — Caddy reverse-proxies ${DOMAIN} -> web:3000.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - diva

  bot:
    build:
      context: ../bot
    container_name: diva-bot
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN}
      ROP_CHAT_ID: ${ROP_CHAT_ID}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: unless-stopped
    networks:
      - diva

  caddy:
    image: caddy:2-alpine
    container_name: diva-caddy
    depends_on:
      - web
      - cms
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ../ops/caddy:/etc/caddy
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/", "--spider"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - diva
