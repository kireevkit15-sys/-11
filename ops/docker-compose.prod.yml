# Diva — production stack for the VPS (Selectel / TimeWeb).
# Usage: `make prod-up` (or `docker compose -f docker-compose.prod.yml --env-file .env up -d`).
# Caddy is the only ingress (80/443) — terminates TLS via Let's Encrypt and reverse-proxies
# to web (Next.js) and diva-admin (custom admin panel). Postgres, web, bot, diva-admin
# are NOT exposed externally. All services live on the internal `diva` bridge network.

networks:
  diva:
    driver: bridge

volumes:
  postgres-data:
  uploads:          # общие пользовательские загрузки (web + diva-admin)
  caddy-data:
  caddy-config:
  caddy-logs:       # /var/log/caddy — без этого логи теряются на рестарте

services:
  postgres:
    build:
      context: ../db
    container_name: diva-pg
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No external port published — only reachable inside `diva` network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - diva

  # Одноразовая применялка drizzle-миграций (единый источник схемы из db/migrations).
  migrate:
    build:
      context: ../db
      dockerfile: migrate.Dockerfile
    container_name: diva-migrate
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: "no"
    networks:
      - diva

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: diva-web
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # On-demand revalidation: web сверяет x-revalidate-secret с этим
      # секретом. Без него webhook всегда падает в 401 и ISR не
      # сбрасывается — сайт показывает старые данные после правок в админке.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    volumes:
      - uploads:/app/public/uploads   # общий том загрузок (пишет diva-admin, отдаёт сайт)
    # No external port — Caddy reverse-proxies ${DOMAIN} -> web:3000.
    healthcheck:
      # node:22-alpine не содержит `wget`/`curl`. Используем встроенный node http.
      # next/image оптимизированные URL иногда 5+ сек при cold start — берём короткий путь.
      test:
        - CMD-SHELL
        - 'node -e "require(''http'').get(''http://localhost:3000/api/health'',r=>process.exit(r.statusCode<500?0:1)).on(''error'',()=>process.exit(1))"'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - diva

  bot:
    build:
      context: ../bot
    container_name: diva-bot
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN}
      ROP_CHAT_ID: ${ROP_CHAT_ID}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Этот контейнер живёт в Docker-сети без IPv6 маршрутизации наружу.
      # По умолчанию dns.lookup() в Node предпочитает AAAA (IPv6) записи,
      # api.telegram.org резолвится в IPv6 первым хопом → ENETUNREACH →
      # ETIMEDOUT внутри Grammy → лиды "отправляются" но теряются.
      # Принудительно идём через IPv4.
      NODE_OPTIONS: --dns-result-order=ipv4first
    restart: unless-stopped
    networks:
      - diva

  # Кастомная админ-панель (Next.js, отдельное приложение). Caddy проксирует
  # ${ADMIN_DOMAIN} -> diva-admin:3001. Требует ADMIN_SESSION_SECRET (>=32 симв.) в .env.
  diva-admin:
    build:
      context: ..
      dockerfile: diva-admin/Dockerfile
      args:
        # NEXT_PUBLIC_* инлайнится в client bundle на build-этапе.
        # Без него resolveMediaUrl в lib/media.ts вернёт относительный
        # путь, и <img src="/team/…"> на admin-домене даст 404.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: diva-admin
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_PORT: 3001
      # Webhook on-demand revalidation: admin дёргает web после каждой
      # мутации (POST/PUT/DELETE), чтобы web немедленно сбросил ISR-кеш.
      # В проде admin и web в одной `diva`-сети — ходим по имени сервиса
      # (host.docker.internal на Linux-VPS не резолвится, в отличие от
      # Docker Desktop на Windows). WEB_REVALIDATE_SECRET = REVALIDATE_SECRET
      # у web: код admin шлёт его в x-revalidate-secret, web сверяет.
      NEXT_PUBLIC_WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      WEB_REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    volumes:
      - uploads:/app/diva-admin/public/uploads   # общий том загрузок
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "require(''http'').get(''http://localhost:3001/api/health'',r=>process.exit(r.statusCode<500?0:1)).on(''error'',()=>process.exit(1))"'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - diva

  # Разовый инструмент: создаёт/сбрасывает пользователя admin_users.
  # НЕ поднимается автоматически (profiles: tools) — только по явному запуску:
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm seed-admin
  # Нужен отдельно от diva-admin, потому что тот собран как Next.js standalone
  # и не содержит ни node_modules (tsx — в devDependencies), ни scripts/.
  # См. DEPLOY-BLOCKERS.md, блокер 3, и diva-admin/seed.Dockerfile.
  seed-admin:
    build:
      context: ..
      dockerfile: diva-admin/seed.Dockerfile
    container_name: diva-seed-admin
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@diva.ru}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    profiles:
      - tools
    restart: "no"
    networks:
      - diva

  caddy:
    image: caddy:2-alpine
    container_name: diva-caddy
    init: true
    depends_on:
      - web
      - diva-admin
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      # Монтируем конкретный файл под именем Caddyfile — образ caddy:2-alpine
      # по умолчанию ищет строго /etc/caddy/Caddyfile. Раньше монтировалась вся
      # папка ops/caddy/ (там Caddyfile.beget/.dev/.prod, но не "Caddyfile") —
      # контейнер падал на старте ("open /etc/caddy/Caddyfile: no such file or
      # directory") и уходил в restart-loop. См. DEPLOY-BLOCKERS.md, блокер 2.
      - ../ops/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # Том загрузок, чтобы Caddy отдавал /uploads/* напрямую через file_server
      # (Next standalone build не отдаёт их сам, т.к. volume подмонтирован уже
      # после сборки — см. комментарий в Caddyfile.prod).
      - uploads:/uploads
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Caddyfile.prod имеет `admin off` (безопасность, не светит :2019 наружу),
      # поэтому admin API healthcheck не работает. Проверяем, что процесс жив
      # через pidof. Реальная проверка работоспособности — это `wget
      # localhost:80` снаружи через ACME-домен (делается внешним монитором).
      test: ["CMD-SHELL", "pidof caddy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - diva
