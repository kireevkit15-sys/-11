# Diva — local development stack with hot reload.
# Usage: `make dev` (or `docker compose -f docker-compose.dev.yml --env-file .env up -d`).
# All services share the `diva` bridge network so they can reach each other by service name.
# Source code is bind-mounted into web/cms/bot for hot reload; node_modules use anonymous volumes.

version: '3.9'

networks:
  diva:
    driver: bridge

volumes:
  postgres-data:
  strapi-uploads:

services:
  postgres:
    build:
      context: ../db
    container_name: diva-pg-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - diva

  cms:
    build:
      context: ../cms
    container_name: diva-cms-dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "1337:1337"
    volumes:
      - ../cms:/app
      - strapi-uploads:/app/public/uploads
      - /app/node_modules
    command: npm run develop
    restart: unless-stopped
    networks:
      - diva

  web:
    build:
      context: ../web
      target: dev
    container_name: diva-web-dev
    depends_on:
      - cms
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    volumes:
      - ../web:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    networks:
      - diva

  bot:
    build:
      context: ../bot
    container_name: diva-bot-dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      BOT_TOKEN: ${BOT_TOKEN}
      ROP_CHAT_ID: ${ROP_CHAT_ID}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ../bot:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    networks:
      - diva
