<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="lineGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fogGradient1" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fogGradient2" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fogGradient3" cx="85%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <style>
    /* Line pulse animation */
    @keyframes linePulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.25; }
    }

    /* Star twinkle animations with stagger */
    @keyframes twinkle1 {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes twinkle2 {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes twinkle3 {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.6; }
    }

    /* Glow pulse for accent points */
    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Constellation lines */
    .constellation-line {
      animation: linePulse 5s ease-in-out infinite;
    }
    .constellation-line:nth-child(2n) { animation-delay: -1s; animation-duration: 6s; }
    .constellation-line:nth-child(3n) { animation-delay: -2s; animation-duration: 4.5s; }
    .constellation-line:nth-child(4n) { animation-delay: -0.5s; animation-duration: 5.5s; }

    /* Small stars */
    .star { animation: twinkle1 3s ease-in-out infinite; }
    .star:nth-child(2n) { animation-name: twinkle2; animation-duration: 2.5s; }
    .star:nth-child(3n) { animation-name: twinkle3; animation-duration: 4s; }
    .star:nth-child(5n) { animation-name: twinkle1; animation-duration: 3.5s; }
    .star:nth-child(7n) { animation-name: twinkle2; animation-duration: 2.8s; }

    /* Major nodes */
    .node {
      animation: twinkle2 4s ease-in-out infinite;
    }
    .node:nth-child(2n) { animation-delay: -1s; animation-duration: 3.5s; }
    .node:nth-child(3n) { animation-delay: -2s; animation-duration: 2.5s; }

    /* Accent nodes with glow */
    .accent-node {
      animation: glowPulse 3s ease-in-out infinite;
    }
    .accent-node:nth-child(2n) { animation-delay: -1.5s; }
  </style>

  <!-- Background fog layers -->
  <rect width="1200" height="800" fill="#0F0B1E"/>
  <ellipse cx="360" cy="160" rx="720" ry="480" fill="url(#fogGradient1)"/>
  <ellipse cx="840" cy="560" rx="600" ry="400" fill="url(#fogGradient2)"/>
  <ellipse cx="1020" cy="200" rx="480" ry="320" fill="url(#fogGradient3)"/>

  <!-- Constellation lines (orbit paths) -->
  <g class="constellation-lines" fill="none" stroke="url(#lineGradient)" stroke-width="0.75">
    <!-- Central constellation cluster -->
    <line class="constellation-line" x1="600" y1="400" x2="480" y2="320" opacity="0.2"/>
    <line class="constellation-line" x1="600" y1="400" x2="720" y2="350" opacity="0.2"/>
    <line class="constellation-line" x1="600" y1="400" x2="550" y2="500" opacity="0.18"/>
    <line class="constellation-line" x1="600" y1="400" x2="680" y2="480" opacity="0.18"/>
    <line class="constellation-line" x1="480" y1="320" x2="380" y2="280" opacity="0.15"/>
    <line class="constellation-line" x1="480" y1="320" x2="520" y2="220" opacity="0.15"/>
    <line class="constellation-line" x1="720" y1="350" x2="820" y2="300" opacity="0.15"/>
    <line class="constellation-line" x1="720" y1="350" x2="780" y2="420" opacity="0.15"/>
    <line class="constellation-line" x1="550" y1="500" x2="450" y2="520" opacity="0.18"/>
    <line class="constellation-line" x1="680" y1="480" x2="780" y2="520" opacity="0.18"/>

    <!-- Secondary connections -->
    <line class="constellation-line" x1="380" y1="280" x2="300" y2="350" opacity="0.12"/>
    <line class="constellation-line" x1="520" y1="220" x2="580" y2="150" opacity="0.12"/>
    <line class="constellation-line" x1="820" y1="300" x2="900" y2="350" opacity="0.12"/>
    <line class="constellation-line" x1="780" y1="420" x2="850" y2="450" opacity="0.12"/>
    <line class="constellation-line" x1="450" y1="520" x2="380" y2="600" opacity="0.12"/>
    <line class="constellation-line" x1="780" y1="520" x2="880" y2="580" opacity="0.12"/>

    <!-- Long distance connections -->
    <line class="constellation-line" x1="300" y1="350" x2="200" y2="280" opacity="0.1"/>
    <line class="constellation-line" x1="580" y1="150" x2="650" y2="80" opacity="0.1"/>
    <line class="constellation-line" x1="900" y1="350" x2="1000" y2="280" opacity="0.1"/>
    <line class="constellation-line" x1="850" y1="450" x2="950" y2="500" opacity="0.1"/>
    <line class="constellation-line" x1="380" y1="600" x2="280" y2="650" opacity="0.1"/>
    <line class="constellation-line" x1="880" y1="580" x2="1000" y2="620" opacity="0.1"/>

    <!-- Cross constellation links -->
    <line class="constellation-line" x1="200" y1="280" x2="150" y2="180" opacity="0.08"/>
    <line class="constellation-line" x1="650" y1="80" x2="750" y2="50" opacity="0.08"/>
    <line class="constellation-line" x1="1000" y1="280" x2="1100" y2="220" opacity="0.08"/>
    <line class="constellation-line" x1="950" y1="500" x2="1050" y2="450" opacity="0.08"/>
    <line class="constellation-line" x1="280" y1="650" x2="180" y2="720" opacity="0.08"/>
    <line class="constellation-line" x1="1000" y1="620" x2="1100" y2="680" opacity="0.08"/>

    <!-- Additional subtle orbits -->
    <line class="constellation-line" x1="150" y1="180" x2="100" y2="120" opacity="0.06"/>
    <line class="constellation-line" x1="750" y1="50" x2="850" y2="30" opacity="0.06"/>
    <line class="constellation-line" x1="1100" y1="220" x2="1150" y2="150" opacity="0.06"/>
    <line class="constellation-line" x1="1050" y1="450" x2="1120" y2="400" opacity="0.06"/>
    <line class="constellation-line" x1="180" y1="720" x2="100" y2="780" opacity="0.06"/>
    <line class="constellation-line" x1="1100" y1="680" x2="1150" y2="750" opacity="0.06"/>
  </g>

  <!-- Glow halos for major nodes -->
  <g class="constellation-glows" fill="url(#glowPurple)">
    <circle class="glow-halo" cx="600" cy="400" r="20" opacity="0.15" filter="url(#glowSoft)"/>
    <circle class="glow-halo" cx="480" cy="320" r="15" opacity="0.12" filter="url(#glowSoft)"/>
    <circle class="glow-halo" cx="720" cy="350" r="15" opacity="0.12" filter="url(#glowSoft)"/>
    <circle class="glow-halo" cx="550" cy="500" r="12" opacity="0.1" filter="url(#glowSoft)"/>
    <circle class="glow-halo" cx="680" cy="480" r="12" opacity="0.1" filter="url(#glowSoft)"/>
  </g>

  <g fill="url(#glowOrange)">
    <circle cx="600" cy="400" r="25" opacity="0.08" filter="url(#glowSoft)"/>
    <circle cx="380" cy="280" r="10" opacity="0.06" filter="url(#glowSoft)"/>
    <circle cx="820" cy="300" r="10" opacity="0.06" filter="url(#glowSoft)"/>
  </g>

  <!-- Major constellation nodes -->
  <g class="constellation-stars">
    <!-- Central hub nodes (larger, with glow) -->
    <circle class="node" cx="600" cy="400" r="5" fill="#A78BFA" filter="url(#glow)"/>
    <circle class="node" cx="480" cy="320" r="4" fill="#A78BFA" filter="url(#glow)"/>
    <circle class="node" cx="720" cy="350" r="4" fill="#A78BFA" filter="url(#glow)"/>
    <circle class="node" cx="550" cy="500" r="3.5" fill="#A78BFA" filter="url(#glow)"/>
    <circle class="node" cx="680" cy="480" r="3.5" fill="#A78BFA" filter="url(#glow)"/>

    <!-- Secondary nodes -->
    <circle class="node" cx="380" cy="280" r="3" fill="#A78BFA" filter="url(#glow)"/>
    <circle class="node" cx="520" cy="220" r="3" fill="#A78BFA"/>
    <circle class="node" cx="820" cy="300" r="3" fill="#A78BFA" filter="url(#glow)"/>
    <circle class="node" cx="780" cy="420" r="3" fill="#A78BFA"/>
    <circle class="node" cx="450" cy="520" r="2.5" fill="#A78BFA"/>
    <circle class="node" cx="780" cy="520" r="2.5" fill="#A78BFA"/>

    <!-- Accent nodes (coral/orange) -->
    <circle class="accent-node" cx="600" cy="400" r="4" fill="#FB923C" filter="url(#glowStrong)"/>
    <circle class="accent-node" cx="380" cy="280" r="2.5" fill="#FB923C" filter="url(#glow)"/>
    <circle class="accent-node" cx="820" cy="300" r="2.5" fill="#FB923C" filter="url(#glow)"/>

    <!-- Tertiary nodes -->
    <circle class="node" cx="300" cy="350" r="2" fill="#A78BFA"/>
    <circle class="node" cx="580" cy="150" r="2" fill="#A78BFA"/>
    <circle class="node" cx="900" cy="350" r="2" fill="#A78BFA"/>
    <circle class="node" cx="850" cy="450" r="2" fill="#A78BFA"/>
    <circle class="node" cx="380" cy="600" r="2" fill="#A78BFA"/>
    <circle class="node" cx="880" cy="580" r="2" fill="#A78BFA"/>

    <!-- Outer constellation points -->
    <circle class="node" cx="200" cy="280" r="1.5" fill="#A78BFA" opacity="0.8"/>
    <circle class="node" cx="650" cy="80" r="1.5" fill="#A78BFA" opacity="0.8"/>
    <circle class="node" cx="1000" cy="280" r="1.5" fill="#A78BFA" opacity="0.8"/>
    <circle class="node" cx="950" cy="500" r="1.5" fill="#A78BFA" opacity="0.8"/>
    <circle class="node" cx="280" cy="650" r="1.5" fill="#A78BFA" opacity="0.8"/>
    <circle class="node" cx="1000" cy="620" r="1.5" fill="#A78BFA" opacity="0.8"/>
  </g>

  <!-- Scattered star field (background texture) -->
  <g class="star-field" fill="#A78BFA" opacity="0.15">
    <!-- Random scattered tiny stars - upper left region -->
    <circle class="star" cx="45" cy="67" r="0.8"/>
    <circle class="star" cx="128" cy="23" r="0.6"/>
    <circle class="star" cx="189" cy="112" r="0.7"/>
    <circle class="star" cx="267" cy="45" r="0.5"/>
    <circle class="star" cx="312" cy="178" r="0.8"/>
    <circle class="star" cx="78" cy="234" r="0.6"/>
    <circle class="star" cx="156" cy="289" r="0.7"/>
    <circle class="star" cx="234" cy="167" r="0.5"/>
    <circle class="star" cx="89" cy="378" r="0.8"/>
