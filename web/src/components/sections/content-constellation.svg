    <circle class="star" cx="145" cy="678" r="0.8"/>
    <circle class="star" cx="223" cy="534" r="0.6"/>

    <!-- Center region scatter -->
    <circle class="star" cx="356" cy="189" r="0.7"/>
    <circle class="star" cx="434" cy="234" r="0.5"/>
    <circle class="star" cx="512" cy="167" r="0.8"/>
    <circle class="star" cx="423" cy="423" r="0.6"/>
    <circle class="star" cx="501" cy="378" r="0.7"/>
    <circle class="star" cx="389" cy="534" r="0.5"/>
    <circle class="star" cx="467" cy="589" r="0.8"/>
    <circle class="star" cx="545" cy="445" r="0.6"/>
    <circle class="star" cx="356" cy="678" r="0.7"/>
    <circle class="star" cx="434" cy="723" r="0.5"/>
    <circle class="star" cx="512" cy="656" r="0.8"/>
    <circle class="star" cx="367" cy="145" r="0.6"/>
    <circle class="star" cx="445" cy="89" r="0.7"/>
    <circle class="star" cx="523" cy="134" r="0.5"/>
    <circle class="star" cx="601" cy="89" r="0.8"/>
    <circle class="star" cx="679" cy="134" r="0.6"/>
    <circle class="star" cx="745" cy="78" r="0.7"/>
    <circle class="star" cx="823" cy="123" r="0.5"/>
    <circle class="star" cx="689" cy="189" r="0.8"/>
    <circle class="star" cx="767" cy="234" r="0.6"/>
    <circle class="star" cx="845" cy="167" r="0.7"/>
    <circle class="star" cx="712" cy="289" r="0.5"/>
    <circle class="star" cx="790" cy="334" r="0.8"/>
    <circle class="star" cx="856" cy="278" r="0.6"/>
    <circle class="star" cx="734" cy="423" r="0.7"/>
    <circle class="star" cx="812" cy="378" r="0.5"/>
    <circle class="star" cx="878" cy="334" r="0.8"/>
    <circle class="star" cx="745" cy="534" r="0.6"/>
    <circle class="star" cx="823" cy="489" r="0.7"/>
    <circle class="star" cx="889" cy="445" r="0.5"/>
    <circle class="star" cx="756" cy="623" r="0.8"/>
