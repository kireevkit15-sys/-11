name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cms: ${{ steps.filter.outputs.cms }}
      bot: ${{ steps.filter.outputs.bot }}
      db: ${{ steps.filter.outputs.db }}
      ops: ${{ steps.filter.outputs.ops }}
      caddy: ${{ steps.filter.outputs.caddy }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
            cms:
              - 'cms/**'
            bot:
              - 'bot/**'
            db:
              - 'db/**'
            ops:
              - 'ops/**'
            caddy:
              - 'ops/caddy/**'
            workflow:
              - '.github/workflows/**'

  web:
    name: Web (Next.js)
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.workflow == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect web/ presence and scripts
        id: check
        shell: bash
        run: |
          if [ -f "web/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            node -e "const p=require('./web/package.json');const s=p.scripts||{};process.stdout.write('lint='+(s.lint?'true':'false')+'\n'+'typecheck='+(s.typecheck?'true':'false')+'\n'+'build='+(s.build?'true':'false')+'\n')" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "lint=false" >> "$GITHUB_OUTPUT"
            echo "typecheck=false" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/package.json missing — skipping web checks"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        if: steps.check.outputs.present == 'true' && hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: Lint
        if: steps.check.outputs.present == 'true' && steps.check.outputs.lint == 'true'
        working-directory: web
        run: npm run lint
      - name: Typecheck
        if: steps.check.outputs.present == 'true'
        working-directory: web
        run: |
          if [ "${{ steps.check.outputs.typecheck }}" = "true" ]; then
            npm run typecheck
          else
            npx --no-install tsc --noEmit
          fi
      - name: Build
        if: steps.check.outputs.present == 'true' && steps.check.outputs.build == 'true'
        working-directory: web
        run: npm run build

  cms:
    name: CMS (Strapi)
    needs: detect-changes
    if: needs.detect-changes.outputs.cms == 'true' || needs.detect-changes.outputs.workflow == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect cms/ presence and scripts
        id: check
        shell: bash
        run: |
          if [ -f "cms/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            node -e "const p=require('./cms/package.json');const s=p.scripts||{};process.stdout.write('lint='+(s.lint?'true':'false')+'\n'+'build='+(s.build?'true':'false')+'\n')" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "lint=false" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::cms/package.json missing — skipping cms checks"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cms/package-lock.json
      - name: Install dependencies
        if: steps.check.outputs.present == 'true' && hashFiles('cms/package.json') != ''
        working-directory: cms
        run: npm ci
      - name: Lint
        if: steps.check.outputs.present == 'true' && steps.check.outputs.lint == 'true'
        working-directory: cms
        run: npm run lint
      - name: Build
        if: steps.check.outputs.present == 'true' && steps.check.outputs.build == 'true'
        working-directory: cms
        run: npm run build

  bot:
    name: Bot (TypeScript)
    needs: detect-changes
    if: needs.detect-changes.outputs.bot == 'true' || needs.detect-changes.outputs.workflow == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect bot/ presence and scripts
        id: check
        shell: bash
        run: |
          if [ -f "bot/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            node -e "const p=require('./bot/package.json');const s=p.scripts||{};process.stdout.write('lint='+(s.lint?'true':'false')+'\n'+'typecheck='+(s.typecheck?'true':'false')+'\n'+'build='+(s.build?'true':'false')+'\n')" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "lint=false" >> "$GITHUB_OUTPUT"
            echo "typecheck=false" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::bot/package.json missing — skipping bot checks"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json
      - name: Install dependencies
        if: steps.check.outputs.present == 'true' && hashFiles('bot/package.json') != ''
        working-directory: bot
        run: npm ci
      - name: Lint
        if: steps.check.outputs.present == 'true' && steps.check.outputs.lint == 'true'
        working-directory: bot
        run: npm run lint
      - name: Typecheck
        if: steps.check.outputs.present == 'true'
        working-directory: bot
        run: |
          if [ "${{ steps.check.outputs.typecheck }}" = "true" ]; then
            npm run typecheck
          else
            npx --no-install tsc --noEmit
          fi
      - name: Build
        if: steps.check.outputs.present == 'true' && steps.check.outputs.build == 'true'
        working-directory: bot
        run: npm run build
